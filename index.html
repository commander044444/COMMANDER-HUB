<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="COMMANDER HUB - داشبورد شخصی مدرن و قدرتمند">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>COMMANDER HUB</title>
  <link rel="manifest" href="manifest.webmanifest?v=13">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=13">
  <link rel="stylesheet" href="css/components.css?v=13">
  <link rel="stylesheet" href="css/themes.css?v=13">
  <link rel="stylesheet" href="css/responsive.css?v=13">
</head>
<body>
  <!-- Lock Screen -->
  <div id="lock-screen" class="lock-screen hidden" aria-hidden="true">
    <div class="lock-content">
      <div class="lock-icon">🔒</div>
      <h1 data-i18n="lock.title">قفل شده</h1>
      <p data-i18n="lock.subtitle">برای ورود رمز عبور یا پین را وارد کنید</p>
      <form id="unlock-form" class="unlock-form">
        <input type="password" id="unlock-input" data-i18n-placeholder="lock.placeholder" placeholder="رمز عبور" autocomplete="current-password" maxlength="32">
        <button type="submit" class="btn btn-primary" data-i18n="lock.unlock">باز کردن</button>
      </form>
      <p id="lock-error" class="error-msg hidden" data-i18n="lock.error">رمز اشتباه است</p>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="منوی اصلی">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">COMMANDER</span>
        </div>
        <button id="sidebar-toggle" class="btn-icon" aria-label="بستن منو" title="بستن منو">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" data-i18n="nav.dashboard">
          <span class="nav-icon">🏠</span><span class="nav-label">داشبورد</span>
        </button>
        <button class="nav-item" data-view="notes" data-i18n="nav.notes">
          <span class="nav-icon">📝</span><span class="nav-label">یادداشت‌ها</span>
        </button>
        <button class="nav-item" data-view="tasks" data-i18n="nav.tasks">
          <span class="nav-icon">✅</span><span class="nav-label">کارها</span>
        </button>
        <button class="nav-item" data-view="calendar" data-i18n="nav.calendar">
          <span class="nav-icon">📅</span><span class="nav-label">تقویم</span>
        </button>
        <button class="nav-item" data-view="crypto" data-i18n="nav.crypto">
          <span class="nav-icon">💰</span><span class="nav-label">رمزارز</span>
        </button>
        <button class="nav-item" data-view="portfolio" data-i18n="nav.portfolio">
          <span class="nav-icon">📊</span><span class="nav-label">پورتفولیو</span>
        </button>
        <button class="nav-item" data-view="news" data-i18n="nav.news">
          <span class="nav-icon">📰</span><span class="nav-label">اخبار</span>
        </button>
        <button class="nav-item" data-view="music" data-i18n="nav.music">
          <span class="nav-icon">🎵</span><span class="nav-label">موسیقی</span>
        </button>
        <button class="nav-item" data-view="settings" data-i18n="nav.settings">
          <span class="nav-icon">⚙️</span><span class="nav-label">تنظیمات</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="workspace-selector">
          <label data-i18n="workspace.label">فضای کاری</label>
          <select id="workspace-select" aria-label="انتخاب فضای کاری"></select>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="btn-icon mobile-only" aria-label="منو">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="search-box">
            <input type="search" id="global-search" data-i18n-placeholder="search.placeholder" placeholder="جستجو..." autocomplete="off">
            <kbd class="search-kbd">Ctrl+K</kbd>
          </div>
        </div>
        <div class="topbar-right">
          <button id="lang-toggle" class="btn-icon" title="تغییر زبان" aria-label="تغییر زبان">
            <span id="lang-label">EN</span>
          </button>
          <button id="theme-toggle" class="btn-icon" title="تغییر تم" aria-label="تغییر تم">
            <span id="theme-icon">🌙</span>
          </button>
          <button id="notifications-btn" class="btn-icon" title="اعلان‌ها" aria-label="اعلان‌ها">
            <span>🔔</span>
            <span id="notif-badge" class="badge hidden">0</span>
          </button>
          <button id="lock-btn" class="btn-icon" title="قفل کردن" aria-label="قفل کردن">
            <span>🔒</span>
          </button>
          <div class="user-profile" id="user-profile">
            <span class="avatar">👤</span>
            <span class="user-name" data-i18n="user.guest">مهمان</span>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <main id="main-content" class="main-content">
        <!-- Views will be injected here -->
      </main>
    </div>
  </div>

  <!-- Command Palette -->
  <div id="command-palette" class="command-palette hidden" role="dialog" aria-modal="true" aria-label="پالت فرمان">
    <div class="command-overlay"></div>
    <div class="command-box">
      <input type="text" id="command-input" data-i18n-placeholder="command.placeholder" placeholder="دستور را تایپ کنید..." autocomplete="off">
      <ul id="command-list" class="command-list" role="listbox"></ul>
    </div>
  </div>

  <!-- Notifications Panel -->
  <div id="notifications-panel" class="notifications-panel hidden" aria-hidden="true">
    <div class="panel-header">
      <h3 data-i18n="notifications.title">اعلان‌ها</h3>
      <button id="clear-notifications" class="btn-text" data-i18n="notifications.clear">پاک کردن</button>
    </div>
    <div id="notifications-list" class="notifications-list"></div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/i18n.js?v=13"></script>
  <script src="js/storage.js?v=13"></script>
  <script src="js/state.js?v=13"></script>
  <script src="js/security.js?v=13"></script>
  <script src="js/widgets.js?v=13"></script>
  <script src="js/dashboard.js?v=13"></script>
  <script src="js/workspaces.js?v=13"></script>
  <script src="js/notes.js?v=13"></script>
  <script src="js/tasks.js?v=13"></script>
  <script src="js/occasions.js?v=13"></script>
  <script src="js/calendar.js?v=13"></script>
  <script src="js/crypto.js?v=13"></script>
  <script src="js/portfolio.js?v=13"></script>
  <script src="js/news.js?v=13"></script>
  <script src="js/weather.js?v=13"></script>
  <script src="js/search.js?v=13"></script>
  <script src="js/backup.js?v=13"></script>
  <script src="js/settings.js?v=13"></script>
  <script src="js/assistant-messages.js?v=13"></script>
  <script src="js/assistant-chat.js?v=13"></script>
  <script src="js/assistant.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
